name: Publish PelicanFS distribution to TestPyPI
on:
  release:
    # Every release goes to TestPyPI -- prereleases and full releases alike.
    # `published` is the only type that fires exactly once for both cases;
    # `prereleased` additionally never fires for a prerelease published from
    # a draft, which would silently skip TestPyPI.
    types:
      - published

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.x"
    - name: Verify tag matches package version
      run: |
        TAG="${GITHUB_REF_NAME#v}"
        PKG_VERSION="$(grep -m1 '^version' pyproject.toml | sed -E 's/.*"(.*)".*/\1/')"
        echo "Release tag: ${TAG}"
        echo "pyproject.toml version: ${PKG_VERSION}"
        if [ "${TAG}" != "${PKG_VERSION}" ]; then
          echo "::error::Release tag (${TAG}) does not match pyproject.toml version (${PKG_VERSION})."
          exit 1
        fi
    - name: Install pypa/build
      run: >-
        python3 -m
        pip install
        build
        --user
    - name: Build a binary wheel and a source tarball
      run: python3 -m build
    - name: List the files in the tarball
      run: python3 -m tarfile --list dist/*.tar.*
    - name: List the files in the wheel
      run: python3 -m zipfile --list dist/*.whl
    - name: Store the distribution packages
      uses: actions/upload-artifact@v4
      with:
        name: python-package-distributions
        path: dist/

  publish-to-test-pypi:
    name: >-
      Publish Python Distribution to TestPyPI
    needs:
    - build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
    permissions:
      id-token: write
    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v4
      with:
        name: python-package-distributions
        path: dist/
    - name: Publish distribution to TestPyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: https://test.pypi.org/legacy/

  github-release:
    # Prereleases only. For a full release the PyPI workflow signs the same
    # dists and attaches them to the same GitHub release, so running this here
    # too would race two uploads of identical assets onto one release.
    if: github.event.release.prerelease
    name: >-
      Sign the Python distribution with Sigstore
      and upload them to GitHub Release
    needs:
    - publish-to-test-pypi
    runs-on: ubuntu-latest

    permissions:
      contents: write  # IMPORTANT: mandatory for making GitHub Releases
      id-token: write  # IMPORTANT: mandatory for sigstore

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v4
      with:
        name: python-package-distributions
        path: dist/
    - name: Sign the dists with Sigstore
      uses: sigstore/gh-action-sigstore-python@v3.5.0
      with:
        inputs: >-
          ./dist/*.tar.gz
          ./dist/*.whl
    - name: Upload artifact signatures to GitHub Release
      env:
        GITHUB_TOKEN: ${{ github.token }}
      # Upload to GitHub Release using the `gh` CLI.
      # `dist/` contains the built packages, and the
      # sigstore-produced signatures and certificates.
      # --clobber: the sigstore action already attaches the *.sigstore.json
      # bundles as release assets (release-signing-artifacts defaults to true),
      # so uploading dist/** would otherwise fail on the existing assets.
      run: >-
        gh release upload
        '${{ github.ref_name }}' dist/**
        --repo '${{ github.repository }}'
        --clobber
