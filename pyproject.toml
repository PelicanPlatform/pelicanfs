[build-system]
requires = ["setuptools >=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pelicanfs"
version = "1.3.1"
description = "An FSSpec Implementation using the Pelican System"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Pelican Platform Developers", email = "info@pelicanplatform.org" }
]
keywords = ["pelican", "fsspec"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
]

requires-python = ">=3.11"
dependencies = [
    "aiohttp >=3.9.4,!=3.14.4,<4",
    "aiowebdav2",
    "cachetools >=5.3,<6",
    "fsspec >=2024.3.1",
    "igwn-auth-utils",
    "pywinpty; platform_system=='Windows'",
]

[project.entry-points."fsspec.specs"]
pelican = "pelicanfs.core:PelicanFileSystem"
osdf = "pelicanfs.core:OSDFFileSystem"

[project.urls]
Source = "https://github.com/PelicanPlatform/pelicanfs"
Pelican-Source = "https://github.com/PelicanPlatform/pelican"
Bug-Reports = "https://github.com/PelicanPlatform/pelicanfs/issues"


[dependency-groups]
testing = [
    "pytest>=9",
    "pytest-httpserver",
    "trustme",
]
dev = [{ include-group = "testing" }]


[tool.pytest]
minversion = "9.0"
addopts = ["-ra", "--showlocals", "--import-mode=importlib"]
strict = true
filterwarnings = ["error"]
log_level = "INFO"
testpaths = ["test"]
markers = [
    "integration: marks tests as integration tests (require live OSDF infrastructure)",
]

[tool.ruff]
line-length = 200
show-fixes = true

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
