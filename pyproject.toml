[build-system]
requires = ["hatchling >=1.27"]
build-backend = "hatchling.build"

[project]
name = "pelicanfs"
version = "1.3.1"
description = "An FSSpec Implementation using the Pelican System"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Pelican Platform Developers", email = "info@pelicanplatform.org" }
]
keywords = ["pelican", "fsspec"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
]

requires-python = ">=3.11"
dependencies = [
    "aiohttp >=3.9.4,!=3.14.4,<4",
    "aiowebdav2",
    "cachetools >=5.3,<6",
    "fsspec >=2024.3.1",
    "igwn-auth-utils",
    "pywinpty; platform_system=='Windows'",
]

[project.entry-points."fsspec.specs"]
pelican = "pelicanfs.core:PelicanFileSystem"
osdf = "pelicanfs.core:OSDFFileSystem"

[project.urls]
Source = "https://github.com/PelicanPlatform/pelicanfs"
Pelican-Source = "https://github.com/PelicanPlatform/pelican"
Bug-Reports = "https://github.com/PelicanPlatform/pelicanfs/issues"

[tool.hatch.build.targets.sdist]
exclude = ["/.github"]


[dependency-groups]
testing = [
    "pytest>=9",
    "pytest-httpserver",
    "trustme",
]
dev = [{ include-group = "testing" }]


[tool.pytest]
minversion = "9.0"
addopts = ["-ra", "--showlocals", "--import-mode=importlib"]
strict = true
filterwarnings = ["error"]
log_level = "INFO"
testpaths = ["test"]
markers = [
    "integration: marks tests as integration tests (require live OSDF infrastructure)",
]

[tool.ruff]
line-length = 200
show-fixes = true

[tool.ruff.lint]
extend-select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "ARG",  # flake8-unused-arguments
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "EM",   # flake8-errmsg
    "EXE",  # flake8-executable
    "FURB", # refurb
    "G",    # flake8-logging-format
    "I",    # isort
    "ICN",  # flake8-import-conventions
    "ISC",  # flake8-implicit-str-concat
    "LOG",  # flake8-logging
    "PERF", # perflint
    "PGH",  # pygrep-hooks
    "PIE",  # flake8-pie
    "PL",   # pylint
    "PT",   # flake8-pytest-style
    "PTH",  # flake8-use-pathlib
    "RET",  # flake8-return
    "RSE",  # flake8-raise
    "RUF",  # Ruff-specific
    "SIM",  # flake8-simplify
    "T20",  # flake8-print
    "UP",   # pyupgrade
    "YTT",  # flake8-2020
]
ignore = [
    "BLE001",  # Token discovery and cache fallbacks catch Exception on purpose
    "PLR09",   # Too many <...>
    "PLR2004", # Magic value used in comparison
]

[tool.ruff.lint.flake8-unused-arguments]
ignore-variadic-names = true

[tool.ruff.lint.per-file-ignores]
"test/**" = ["ARG001", "PLC0415", "T20"]
# Tests mock os.path and builtins.open for this module
"src/pelicanfs/token_content_iterator.py" = ["PTH"]
